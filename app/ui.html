<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fatura Ayıklayıcı</title><style>
:root{--bg:#0e1013;--c:#171a1f;--l:#2b3038;--t:#e9ecf1;--m:#8c95a3;--g:#3ecf8e;--y:#f5b942}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--t)}
.w{max-width:900px;margin:0 auto;padding:30px 20px}h1{font-size:20px;margin:0}.s{color:var(--m);margin:4px 0 18px}
.drop{border:2px dashed var(--l);border-radius:14px;padding:34px;text-align:center;color:var(--m);cursor:pointer}
.drop.on{border-color:var(--g);color:var(--t)}.card{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:16px;margin-top:16px}
table{width:100%;border-collapse:collapse;margin-top:8px}td,th{padding:6px 8px;border-bottom:1px solid var(--l);text-align:left}th{color:var(--m);font-weight:500}
.ok{color:var(--g)}.warn{color:var(--y)}pre{background:#0b0d10;padding:12px;border-radius:10px;overflow:auto;font-size:12px}
</style></head><body><div class="w">
<h1>Fatura / Evrak Ayıklayıcı</h1><p class="s">PDF faturayı bırak: lokal LLM yapılandırılmış JSON çıkarır, iş kuralları toplamları ve VKN'leri doğrular.</p>
<label class="drop" id="drop">PDF faturayı buraya sürükle ya da tıkla<input type="file" id="f" accept="application/pdf" hidden></label>
<div id="out"></div></div>
<script>
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
drop.ondragover=e=>{e.preventDefault();drop.classList.add("on")};drop.ondragleave=()=>drop.classList.remove("on");
drop.ondrop=e=>{e.preventDefault();drop.classList.remove("on");gonder(e.dataTransfer.files[0])};f.onchange=()=>gonder(f.files[0]);
async function gonder(file){if(!file)return;out.innerHTML='<div class="card">Okunuyor ve ayıklanıyor…</div>';
 const fd=new FormData();fd.append("dosya",file);const r=await fetch("/ayikla",{method:"POST",body:fd}).then(r=>r.json()),v=r.veri;
 const durum=r.uyarilar.length?'<span class="warn">⚠ Kontrol gerekli: '+r.uyarilar.map(esc).join(", ")+'</span>':'<span class="ok">✓ Tüm kontroller geçti</span>';
 const kal=v.kalemler.map(k=>"<tr><td>"+esc(k.aciklama)+"</td><td>"+k.miktar+"</td><td>"+k.birim_fiyat+"</td><td>"+k.tutar+"</td></tr>").join("");
 out.innerHTML='<div class="card"><b>'+esc(v.satici_unvan)+'</b> → '+esc(v.alici_unvan)+'<br>No: '+esc(v.fatura_no)+' · Tarih: '+esc(v.tarih)+'<br>'+durum+
 '<table><tr><th>Açıklama</th><th>Miktar</th><th>Birim</th><th>Tutar</th></tr>'+kal+'</table>'+
 '<p>Ara toplam: <b>'+v.ara_toplam+'</b> · KDV %'+v.kdv_orani+': <b>'+v.kdv_tutari+'</b> · Genel toplam: <b>'+v.genel_toplam+'</b></p>'+
 '<details><summary>JSON</summary><pre>'+esc(JSON.stringify(r,null,2))+'</pre></details></div>'}
</script></body></html>
